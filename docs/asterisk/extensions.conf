; Asterisk dialplan for the shift call-out IVR (Phase 4, replaces Twilio SMS).
;
; Merge this context into /etc/asterisk/extensions.conf on the PBX and reload
; with `asterisk -rx "dialplan reload"`.
;
; The backend spools call files into /var/spool/asterisk/outgoing with
;   Context: from-internal
;   Extension: s
;   Set: SHIFT_ID=<id>
;   Set: SHIFT_ROLE=<role>
; (see back/app/services/asterisk.py and ASTERISK_OUTBOUND_CONTEXT).
;
; Custom audio expected under /var/lib/asterisk/sounds/custom/:
;   shift_callout_alert.wav  "An urgent shift coverage is required."
;   press_1_to_accept.wav    "Press 1 to accept the shift."
;   shift_assigned.wav       "Shift assigned. Thank you."
;
; The accept callback authenticates with the shared pickup token
; (ASTERISK_PICKUP_TOKEN in the backend config.env) so only this PBX can
; mark a shift covered.

[from-internal]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(custom/shift_callout_alert) ; "An urgent shift coverage is required."
 same => n,SayAlpha(${SHIFT_ROLE})
 same => n,Read(PICKUP_CHOICE,custom/press_1_to_accept,1,,1,10)
 same => n,Goto($["${PICKUP_CHOICE}" = "1"]?accept:hangup)

 same => n(accept),System(curl -s -X POST -H "X-Asterisk-Token: ${AST_PICKUP_TOKEN}" http://back:8000/shifts/${SHIFT_ID}/pickup)
 same => n,Playback(custom/shift_assigned)
 same => n,Hangup()

 same => n(hangup),Hangup()
